apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-remastered
  namespace: spotify-app
  labels:
    app: spotify-remastered
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: spotify-remastered
  template:
    metadata:
      labels:
        app: spotify-remastered
    spec:
      containers:
        - name: spotify-remastered
          image: ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1337
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "1337"
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-remastered
  namespace: spotify-app
spec:
  type: NodePort
  selector:
    app: spotify-remastered
  ports:
    - protocol: TCP
      port: 80
      targetPort: 1337
      nodePort: 30007