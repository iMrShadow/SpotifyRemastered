name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '**/.gitignore'
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '**/.gitignore'
  workflow_dispatch:
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean compile

      - name: Run tests
        run: mvn test
        env:
          JUNIT_JUPITER_PARALLEL: true

  quality-check:
    name: Static Analysis (Checkstyle and SpotBugs)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Run SpotBugs
        run: mvn spotbugs:check

  sast-snyk:
    name: SAST Security Scan (Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Snyk CLI
        run: |
          curl -Lo snyk https://static.snyk.io/cli/latest/snyk-linux
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Code (Enforcing Fail on Severe Issues)
        run: snyk code test --severity-threshold=high --fail-on=all

  docker-scan:
    name: Test Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
     security-events: write
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t spotifyremastered:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: spotifyremastered:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: 0
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
        sha: ${{ github.sha }}
        ref: ${{ github.ref }}