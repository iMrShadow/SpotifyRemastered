name: CD Pipeline
on:
  push:
    branches: [ "main" ]
    paths-ignore:
        - '**/*.md'
        - '.gitignore'
        - '**/.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push the Docker Container
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:latest
            ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:${{ github.sha }}

  k8s-deployment:
    name: Deploy the app
    runs-on: self-hosted
    needs: [build-and-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kubernetes Cluster Access
        run: |
            echo "Checking Kubernetes cluster connection..."
            kubectl cluster-info
            kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
          echo "Forcing rollout restart to pull latest image..."
          kubectl rollout restart deployment/spotify-remastered -n spotify-app
          
      - name: Wait for Rollout to Complete
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/spotify-remastered -n spotify-app --timeout=5m

      - name: Verify Deployment
        run: |
          echo "Deployment successful!  Current status:"
          kubectl get pods -n spotify-app
          kubectl get services -n spotify-app

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed!  Rolling back to previous version..."
          kubectl rollout undo deployment/spotify-remastered -n spotify-app
          kubectl rollout status deployment/spotify-remastered -n spotify-app --timeout=3m