name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - dev
jobs:

  build-and-push:
    name: Build and Push the Docker Container
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:latest

  k8s-deployment:
    name: Deploy the app
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Setup Minikube
        uses: medyagh/setup-minikube@master
      - name: Checkout
        uses: actions/checkout@v4
      - name: Minikube Docker Pull
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:latest
          minikube image load ${{ secrets.DOCKER_USERNAME }}/spotifyremastered:latest
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/spotify-remastered --timeout=5m
      - name: Rollback Deployment (if failed)
        if: failure()
        run: |
          kubectl rollout undo deployment/spotify-remastered
      - name: Check Kubernetes Status
        run: kubectl get all
      - name: Stop Minikube
        run: minikube stop